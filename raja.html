<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07120d"><title>الرجاء الرياضي | كورة اليوم</title><style>:root{--bg:#07120d;--card:#0d1d15;--line:#203b2d;--txt:#f7faf8;--muted:#9eb3a8;--g:#27d468;--r:#ff5364}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 450px at 80% 0,#15532f,transparent 60%),var(--bg);color:var(--txt);font-family:system-ui,Tahoma,Arial}.wrap{width:min(1150px,92%);margin:auto}a{color:inherit;text-decoration:none}.top{padding:18px 0;border-bottom:1px solid var(--line)}.logo{font-size:1.5rem;font-weight:950}.logo span{color:var(--g)}.hero{margin:35px 0;background:linear-gradient(145deg,#174d2d,#0b1b13);border:1px solid #32784f;border-radius:25px;padding:28px}.club{display:flex;align-items:center;gap:17px}.crest{width:75px;height:75px;border-radius:50%;display:grid;place-items:center;background:#19552f;border:1px solid #56b976;font-size:2.5rem}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:linear-gradient(145deg,#11251b,#0b1a13);border:1px solid var(--line);border-radius:20px;padding:20px}.teams{display:grid;grid-template-columns:1fr auto 1fr;text-align:center;align-items:center;gap:8px;margin:14px 0}.score{font-size:1.5rem;font-weight:950}.live{color:#ff7180;font-weight:900}.tag{color:#8df0ad;font-weight:900}h1{font-size:clamp(2rem,5vw,3.7rem);margin:0 0 8px}h2{margin-top:35px}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="wrap"><a class="logo" href="index.html">⚽ كورة<span>اليوم</span></a></div></div><main class="wrap"><section class="hero"><div class="club"><div class="crest">🦅</div><div><h1>الرجاء الرياضي</h1><div class="muted">Raja Club Athletic • الدار البيضاء</div></div></div></section><h2>⚽ مباريات الرجاء</h2><div id="matches" class="grid"><div class="card">جاري تحميل مباريات الرجاء...</div></div><h2>📰 آخر أخبار الرجاء</h2><div id="news" class="grid"><div class="card">جاري تحميل الأخبار...</div></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){try{const d=await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/mar.1/scoreboard?limit=100&_='+Date.now()).then(r=>r.json());const ms=(d.events||[]).filter(e=>/Raja|Raj|Casablanca/i.test(JSON.stringify(e)));document.getElementById('matches').innerHTML=ms.length?ms.map(e=>{const c=e.competitions?.[0],cs=c?.competitors||[];return `<article class="card"><div class="tag">🇲🇦 المغرب</div><div class="teams"><b>${esc(cs[0]?.team?.displayName)}</b><strong class="score">${esc(cs[0]?.score||0)} - ${esc(cs[1]?.score||0)}</strong><b>${esc(cs[1]?.team?.displayName)}</b></div><div class="muted">${esc(e.status?.type?.detail||e.date||'')}</div></article>`}).join(''):'<div class="card">لا توجد مباراة للرجاء متاحة حالياً.</div>'}catch(e){}}async function news(){try{const d=await fetch('data/raja-news.json?v='+Date.now()).then(r=>r.json());document.getElementById('news').innerHTML=(d.items||[]).map(x=>`<article class="card"><div class="tag">🟢 الرجاء</div><h3>${esc(x.title)}</h3><p class="muted">${esc(x.summary||'')}</p><small class="muted">${esc(x.source||'')}</small><br><a style="color:#8df0ad;font-weight:900" target="_blank" href="${esc(x.url)}">قراءة الخبر ↗</a></article>`).join('')||'<div class="card">لا توجد أخبار حالياً.</div>'}catch(e){}}load();news();setInterval(load,30000);setInterval(news,300000)</script></body></html>
