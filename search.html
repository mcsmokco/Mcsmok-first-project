<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>البحث | كورة اليوم</title><style>:root{--bg:#07120d;--card:#0d1d15;--line:#203b2d;--txt:#f7faf8;--muted:#9eb3a8;--g:#27d468}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 450px at 80% 0,#15532f,transparent 60%),var(--bg);color:var(--txt);font-family:system-ui,Tahoma,Arial}.wrap{width:min(1100px,92%);margin:auto}header{padding:18px 0;border-bottom:1px solid var(--line)}a{color:inherit;text-decoration:none}.logo{font-size:1.5rem;font-weight:950}.logo span{color:var(--g)}h1{margin:45px 0 15px}.search{display:flex;gap:8px}.search input{flex:1;background:#091811;border:1px solid var(--line);border-radius:14px;padding:14px;color:white;font-size:1rem;outline:none}.search button{border:0;border-radius:14px;background:#176d3a;color:white;padding:0 22px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:25px 0}.card{background:linear-gradient(145deg,#11251b,#0b1a13);border:1px solid var(--line);border-radius:20px;padding:20px}.tag{color:#8df0ad;font-weight:900}.muted{color:var(--muted)}.read{color:#8df0ad;font-weight:900}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><a class="logo" href="index.html">⚽ كورة<span>اليوم</span></a></div></header><main class="wrap"><h1>🔎 البحث في كورة اليوم</h1><p class="muted">ابحث في الأخبار التي يتم تحديثها تلقائياً.</p><form class="search" onsubmit="event.preventDefault();run()"><input id="q" autofocus placeholder="مثلاً: الرجاء، ريال مدريد، دوري الأبطال..."><button>بحث</button></form><div id="results" class="grid"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function run(){const q=document.getElementById('q').value.trim().toLowerCase();const box=document.getElementById('results');if(!q){box.innerHTML='';return}let arr=[];for(const p of ['data/news.json','data/raja-news.json']){try{const d=await fetch(p+'?v='+Date.now()).then(r=>r.json());arr=arr.concat(d.items||[])}catch(e){}}arr=arr.filter(x=>(x.title+' '+(x.summary||'')+' '+(x.source||'')).toLowerCase().includes(q));box.innerHTML=arr.length?arr.map(x=>`<article class="card"><span class="tag">📰 خبر</span><h3>${esc(x.title)}</h3><p class="muted">${esc(x.summary||'')}</p><div class="muted">${esc(x.source||'')}</div><a class="read" href="${esc(x.url)}" target="_blank" rel="noopener">قراءة الخبر ↗</a></article>`).join(''):'<div class="card" style="grid-column:1/-1;text-align:center">لا توجد نتائج لهذا البحث.</div>'}run()</script></body></html>
