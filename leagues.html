<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدوريات | كورة اليوم</title><style>:root{--bg:#07120d;--card:#0d1d15;--line:#203b2d;--txt:#f7faf8;--muted:#9eb3a8;--g:#27d468}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 450px at 80% 0,#15532f,transparent 60%),var(--bg);color:var(--txt);font-family:system-ui,Tahoma,Arial}.wrap{width:min(1150px,92%);margin:auto}a{color:inherit;text-decoration:none}header{border-bottom:1px solid var(--line);padding:18px 0}.logo{font-size:1.5rem;font-weight:950}.logo span{color:var(--g)}h1{font-size:clamp(2rem,5vw,4rem);margin:45px 0 10px}.muted{color:var(--muted)}.chips{display:flex;gap:9px;overflow:auto;margin:25px 0}.chip{padding:10px 15px;border:1px solid var(--line);border-radius:999px;background:var(--card);white-space:nowrap;cursor:pointer}.chip.active{background:#176d3a;border-color:#3da862}.panel{background:linear-gradient(145deg,#11251b,#0b1a13);border:1px solid var(--line);border-radius:22px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:center}.table th{color:#8df0ad}.form{display:flex;gap:5px;justify-content:center}.ball{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:#174d2d;font-size:.7rem}.win{background:#1c8b4b}.draw{background:#685c25}.loss{background:#6b2630}@media(max-width:700px){.grid{grid-template-columns:1fr}.table{font-size:.85rem}}</style></head><body><header><div class="wrap"><a class="logo" href="index.html">⚽ كورة<span>اليوم</span></a></div></header><main class="wrap"><h1 id="title">🏆 الدوري</h1><p class="muted">الترتيب، نتائج المباريات والمعلومات الأساسية للدوري.</p><div id="chips" class="chips"></div><section class="panel"><h2>📊 جدول الترتيب</h2><div id="standings">جاري التحميل...</div></section><section class="panel"><h2>⚽ مباريات الدوري</h2><div id="matches">جاري التحميل...</div></section></main><script>const leagues=[['eng.1','🏴 الدوري الإنجليزي'],['esp.1','🇪🇸 الدوري الإسباني'],['ita.1','🇮🇹 الدوري الإيطالي'],['ger.1','🇩🇪 الدوري الألماني'],['fra.1','🇫🇷 الدوري الفرنسي'],['uefa.champions','⭐ دوري أبطال أوروبا'],['mar.1','🇲🇦 الدوري المغربي']];let code=new URLSearchParams(location.search).get('code')||'eng.1';function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function chips(){document.getElementById('chips').innerHTML=leagues.map(x=>`<a class="chip ${x[0]===code?'active':''}" href="?code=${x[0]}">${x[1]}</a>`).join('')}async function load(){const label=leagues.find(x=>x[0]===code)?.[1]||'الدوري';document.getElementById('title').textContent='🏆 '+label;chips();let s={};try{s=await fetch(`https://site.api.espn.com/apis/v2/sports/soccer/leagues/${code}/standings?_=${Date.now()}`).then(r=>r.json())}catch(e){}let rows=s?.children?.[0]?.standings?.entries||s?.standings?.entries||[];if(!rows.length){document.getElementById('standings').innerHTML='<div class="muted">الترتيب غير متاح حالياً لهذه البطولة.</div>'}else{document.getElementById('standings').innerHTML='<table class="table"><thead><tr><th>#</th><th>الفريق</th><th>لعب</th><th>ف</th><th>ت</th><th>خ</th><th>نقاط</th><th>فورمة</th></tr></thead><tbody>'+rows.map((r,i)=>{const a={};(r.stats||[]).forEach(x=>a[x.name]=x.value);return `<tr><td>${i+1}</td><td><b>${esc(r.team?.displayName||r.team?.name||'فريق')}</b></td><td>${a.gamesPlayed??a.p??'-'}</td><td>${a.wins??'-'}</td><td>${a.ties??'-'}</td><td>${a.losses??'-'}</td><td><b>${a.points??'-'}</b></td><td><div class="form">—</div></td></tr>`}).join('')+'</tbody></table>'}try{const d=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${code}/scoreboard?limit=30&_=${Date.now()}`).then(r=>r.json());const ev=d.events||[];document.getElementById('matches').innerHTML=ev.length?'<div class="grid">'+ev.map(e=>{const c=e.competitions?.[0],cs=c?.competitors||[];return `<article class="panel"><div class="muted">${esc(e.status?.type?.detail||e.date||'')}</div><h3>${esc(cs[0]?.team?.displayName||'')}</h3><strong>${esc(cs[0]?.score||'-')}</strong> — <strong>${esc(cs[1]?.score||'-')}</strong><h3>${esc(cs[1]?.team?.displayName||'')}</h3></article>`}).join('')+'</div>':'<div class="muted">لا توجد مباريات متاحة حالياً.</div>'}catch(e){}}chips();load();</script></body></html>
